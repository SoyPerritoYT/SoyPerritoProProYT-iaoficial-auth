<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoyPerritoProProYT.IAOFICIAL — Conectar GitHub</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,Arial,sans-serif;background:#0b1020;color:#fff;padding:24px}
.card{width:min(460px,100%);padding:32px;border:1px solid #26304d;border-radius:24px;background:#121a2e;text-align:center}
.dog{font-size:64px}.muted{color:#aeb8d0;line-height:1.5}
button{width:100%;min-height:48px;margin-top:18px;border:0;border-radius:14px;background:#fff;color:#111827;font-size:16px;font-weight:700;cursor:pointer}
button.secondary{background:#26304d;color:#fff}.status{margin-top:18px;min-height:24px;color:#aeb8d0}
.user{margin-top:20px;padding:16px;border-radius:16px;background:#0d1426;text-align:left}
.hidden{display:none}
</style>
</head>
<body>
<main class="card">
<div class="dog">🐶</div>
<h1>SoyPerritoProProYT.IAOFICIAL</h1>
<p class="muted">Elige qué quieres permitir a SoyPerritoProProYT.IAOFICIAL.</p>
<button id="read">👀 Sí, solo ver mi GitHub</button>
<button id="write">✏️ Sí, permitir crear y modificar archivos</button>
<button id="deny" class="secondary">❌ No, no doy permiso</button>
<button id="logout" class="secondary hidden">Cerrar conexión</button>

<div id="user" class="user hidden"></div>
<div id="status" class="status" aria-live="polite">Comprobando conexión...</div>
</main>

<script>
const read=document.getElementById('read');const write=document.getElementById('write');const deny=document.getElementById('deny');
const logout=document.getElementById('logout');
const status=document.getElementById('status');
const user=document.getElementById('user');

async function checkConnection(){
  try{
    const r=await fetch('/api/github-me',{credentials:'same-origin'});
    const data=await r.json();
    if(data.connected){
      read.classList.add('hidden');write.classList.add('hidden');deny.classList.add('hidden');
      logout.classList.remove('hidden');
      user.classList.remove('hidden');
      user.innerHTML='<strong>🐙 GitHub conectado</strong><br>Cuenta: <b>'+escapeHtml(data.login)+'</b>';
      status.textContent='🟢 Conexión activa.';
    }else{
      read.classList.remove('hidden');write.classList.remove('hidden');deny.classList.remove('hidden');
      logout.classList.add('hidden');
      user.classList.add('hidden');
      status.textContent='⚪ GitHub no está conectado.';
    }
  }catch{
    status.textContent='❌ No se pudo comprobar la conexión.';
  }
}

button.addEventListener('click',()=>{
  status.textContent='🔐 Abriendo GitHub...';
  window.location.href='/api/github-auth?action=login';
});

logout.addEventListener('click',async()=>{
  status.textContent='🔐 Cerrando conexión...';
  await fetch('/api/github-logout',{method:'POST',credentials:'same-origin'});
  await checkConnection();
});

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

checkConnection();
</script>
</body>
</html>
