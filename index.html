<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoyPerritoProProYT.IAOFICIAL — Conectar GitHub</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,Arial,sans-serif;background:#0b1020;color:#fff;padding:24px}
.card{width:min(460px,100%);padding:32px;border:1px solid #26304d;border-radius:24px;background:#121a2e;text-align:center}
.dog{font-size:64px}.muted{color:#aeb8d0;line-height:1.5}
button{width:100%;min-height:48px;margin-top:18px;border:0;border-radius:14px;background:#fff;color:#111827;font-size:16px;font-weight:700;cursor:pointer}
button.secondary{background:#26304d;color:#fff}.status{margin-top:18px;min-height:24px;color:#aeb8d0}
.hidden{display:none}
</style>
</head>
<body>
<main class="card">
<div class="dog">🐶</div>
<h1>SoyPerritoProProYT.IAOFICIAL</h1>
<p class="muted">Elige qué quieres permitir a SoyPerritoProProYT.IAOFICIAL.</p>
<button id="read">👀 Sí, solo ver mi GitHub</button>
<button id="write">✏️ Sí, permitir crear y modificar archivos</button>
<button id="deny" class="secondary">❌ No, no doy permiso</button>
<div id="status" class="status" aria-live="polite">Elige una opción para continuar.</div>
</main>
<script>
const MAIN="https://soyperritoproproyt-iaoficial.vercel.app";
document.getElementById("read").onclick=()=>location.href=MAIN+"/api/github-auth?action=login&permission=read";
document.getElementById("write").onclick=()=>location.href=MAIN+"/api/github-auth?action=login&permission=write";
document.getElementById("deny").onclick=()=>document.getElementById("status").textContent="❌ No se ha concedido permiso.";
</script>
</body>
</html>
