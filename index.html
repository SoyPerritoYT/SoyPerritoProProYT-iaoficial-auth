<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoyPerritoProProYT.IAOFICIAL — Auth</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,Arial,sans-serif;background:#0b1020;color:#fff;padding:24px}.card{width:min(460px,100%);padding:32px;border:1px solid #26304d;border-radius:24px;background:#121a2e;text-align:center}.dog{font-size:64px}.muted{color:#aeb8d0;line-height:1.5}button{width:100%;min-height:48px;margin-top:18px;border:0;border-radius:14px;background:#fff;color:#111827;font-size:16px;font-weight:700;cursor:pointer}button:hover{filter:brightness(.94)}.status{margin-top:18px;min-height:24px;color:#aeb8d0}
</style>
</head>
<body>
<main class="card">
<div class="dog">🐶</div>
<h1>SoyPerritoProProYT.IAOFICIAL</h1>
<p class="muted">Autenticación oficial para conectar tu cuenta de GitHub con tu IA.</p>
<button id="github">🐙 Continuar con GitHub</button>
<div id="status" class="status" aria-live="polite"></div>
</main>
<script>
const button=document.getElementById('github');
const status=document.getElementById('status');
button.addEventListener('click',()=>{
 status.textContent='🔐 Preparando la conexión con GitHub...';
 const returnUrl=window.location.origin+'/';
 const state=btoa(encodeURIComponent(returnUrl)).replace(/=+$/,'');
 const clientId='REEMPLAZAR_CON_GITHUB_CLIENT_ID';
 const url='https://github.com/login/oauth/authorize?client_id='+encodeURIComponent(clientId)+'&redirect_uri='+encodeURIComponent(window.location.origin+'/api/github-auth')+'&scope='+encodeURIComponent('read:user');
 if(clientId.startsWith('REEMPLAZAR_')){
   status.textContent='⚙️ Falta configurar el Client ID de GitHub en el backend.';
   return;
 }
 window.location.href=url+'&state='+encodeURIComponent(state);
});
</script>
</body>
</html>
